<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Magic 8 Ball · Courtney or Sana?</title>
  <meta name="description" content="Ask the Magic 8 Ball a question. It only knows two answers: Courtney or Sana.">
  <meta name="theme-color" content="#0b0a09">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3' r='.8'%3E%3Cstop offset='0' stop-color='%23555'/%3E%3Cstop offset='.5' stop-color='%23111'/%3E%3Cstop offset='1' stop-color='%23000'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23f4f1ea'/%3E%3Ctext x='32' y='38.5' font-family='Arial,sans-serif' font-weight='700' font-size='18' text-anchor='middle' fill='%23111'%3E8%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Inter:wght@400;500;600;700&family=Oswald:wght@500&display=swap">

  <link rel="stylesheet" href="style.css">
  <script src="8-ball.js" defer></script>
</head>
<body>
  <header class="nav">
    <a class="nav__brand" href="./">Courtney <em>or</em> Sana?</a>
    <nav class="nav__links" aria-label="Pick a decider">
      <a class="nav__link" href="./">Coin Flip</a>
      <a class="nav__link" href="8-ball.html" aria-current="page">8 Ball</a>
    </nav>
  </header>

  <main class="stage">
    <h1 class="sr-only">Magic 8 Ball: Courtney or Sana?</h1>

    <div class="arena arena--ball" data-arena>
      <div class="arena__glow" aria-hidden="true"></div>
      <div class="arena__shadow arena__shadow--ball" aria-hidden="true"></div>

      <div class="ball" role="img" aria-label="Magic 8 Ball, eight side up" data-ball>
        <div class="ball__eight" data-ball-eight><span>8</span></div>

        <div class="ball__window" data-ball-window>
          <div class="ball__bob">
            <svg class="ball__die" viewBox="0 0 200 200" aria-hidden="true" focusable="false" data-ball-die>
              <defs>
                <linearGradient id="g-die" x1="0.3" y1="0" x2="0.7" y2="1">
                  <stop offset="0" stop-color="#4a6cf0"/>
                  <stop offset="0.55" stop-color="#2a45bf"/>
                  <stop offset="1" stop-color="#16277a"/>
                </linearGradient>
              </defs>
              <polygon points="100,22 186,171 14,171" fill="url(#g-die)" stroke="#89a2ff" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
              <polygon points="100,38 171,162 29,162" fill="none" stroke="#c9d5ff" stroke-opacity="0.16" stroke-width="1.5" stroke-linejoin="round"/>
              <text class="ball__die-text" x="100" y="150" text-anchor="middle" data-ball-die-text></text>
            </svg>
          </div>
          <div class="ball__glass"></div>
        </div>

        <div class="ball__gloss"></div>
      </div>
    </div>

    <div class="result result--ball is-idle" data-result>
      <p class="result__lead" data-result-lead>&nbsp;</p>
      <p class="result__name" data-result-name>Courtney or Sana?</p>
    </div>

    <form class="ask" data-ask>
      <label class="sr-only" for="question">Your question for the Magic 8 Ball</label>
      <input class="ask__input" id="question" name="question" type="text" maxlength="120"
        placeholder="Ask the ball a question…" autocomplete="off" enterkeyhint="go" data-question>
      <button class="flip ask__button" type="submit" data-shake>Shake</button>
    </form>

    <p class="tally" data-tally>
      Courtney: <span data-count="courtney">0</span>
      <span class="tally__sep" aria-hidden="true">|</span>
      Sana: <span data-count="sana">0</span>
    </p>

    <p class="sr-only" aria-live="polite" aria-atomic="true" data-announce></p>
  </main>
</body>
</html>
